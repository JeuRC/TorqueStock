<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Imprimir Etiqueta - {{ producto.sku }}</title>
    <!-- JsBarcode CDN -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        /* CSS Optimizado para impresora térmica (ej. 50mm x 25mm) */
        @page {
            size: 50mm 25mm;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 2mm;
            width: 46mm;
            height: 21mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            background: white;
            color: black;
        }

        .product-name {
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .price {
            font-size: 12px;
            font-weight: 900;
            margin-top: 2px;
        }

        svg {
            max-width: 100%;
            height: 12mm;
        }
    </style>
</head>

<body onload="generarBarcodeEImprimir()">
    <div class="product-name">{{ producto.nombre }}</div>
    <svg id="barcode"></svg>
    <div class="price">Precio: ${{ producto.precio }}</div>

    <script>
        function generarBarcodeEImprimir() {
            JsBarcode("#barcode", "{{ producto.codigo_barras }}", {
                format: "CODE128",
                width: 1.5,
                height: 40,
                displayValue: true,
                fontSize: 10,
                margin: 0
            });
            // Disparar impresión automática después de renderizar el SVG
            setTimeout(() => { window.print(); }, 300);
        }
    </script>
</body>

</html>
